<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>♟️ ألغاز الشطرنج</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/board.css" />
</head>
<body>
  <header class="app-header">
    <span class="header-logo">♟️ ألغاز الشطرنج</span>
  </header>

  <main class="app-main">
    <div class="puzzle-panel">
      <div class="puzzle-info">
        <span id="puzzle-counter" class="puzzle-counter">#—</span>
        <span id="progress-text" class="progress-text">🏆 0</span>
      </div>
      <p id="puzzle-instruction" class="puzzle-instruction">جارٍ جلب اللغز...</p>
    </div>

    <section class="board-section">
      <div id="board" class="board" role="grid" aria-label="رقعة الشطرنج" dir="ltr"></div>
    </section>

    <p id="status-message" class="status-message" aria-live="polite"></p>
    <p id="loading-message" class="loading-message hidden">⏳ جارٍ جلب لغز...</p>

    <section class="bottom-bar">
      <button id="btn-hint" class="nav-btn" type="button">
        <span class="nav-icon">💡</span>
        <span class="nav-label">تلميح</span>
      </button>
      <button id="btn-reset" class="nav-btn" type="button">
        <span class="nav-icon">↩️</span>
        <span class="nav-label">إعادة</span>
      </button>
      <button id="btn-next" class="nav-btn" type="button" disabled>
        <span class="nav-icon">⏭️</span>
        <span class="nav-label">التالي</span>
      </button>
      <button id="btn-new" class="nav-btn" type="button">
        <span class="nav-icon">🔄</span>
        <span class="nav-label">جديد</span>
      </button>
    </section>

    <div id="win-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-icon">🏆</div>
        <h2 class="modal-title">أحسنت!</h2>
        <p class="modal-text">أكملت اللغز بنجاح</p>
        <button id="btn-play-again" class="btn btn-primary" type="button">🔄 العب مجدداً</button>
      </div>
    </div>
  </main>

  <script src="assets/libs/chess.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/puzzles.js"></script>
  <script src="assets/js/board.js"></script>
  <script src="assets/js/game.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
