<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تطبيق ألغاز الشطرنج — تدرّب على إيجاد النقلة الصحيحة" />
  <title>♟️ ألغاز الشطرنج</title>

  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/board.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">♟️ ألغاز الشطرنج</h1>
    <p class="app-subtitle">اعثر على النقلة الصحيحة</p>
  </header>

  <main class="app-main">
    <section class="puzzle-panel">
      <div class="puzzle-info">
        <span class="puzzle-label">اللغز</span>
        <span id="puzzle-counter" class="puzzle-counter">1 / 1</span>
      </div>
      <p id="puzzle-instruction" class="puzzle-instruction">—</p>
    </section>

    <section class="board-section">
      <div id="board" class="board" role="grid" aria-label="رقعة الشطرنج"></div>
    </section>

    <section class="controls">
      <button id="btn-hint" class="btn btn-secondary" type="button">💡 تلميح</button>
      <button id="btn-reset" class="btn btn-secondary" type="button">🔄 إعادة</button>
      <button id="btn-next" class="btn btn-primary" type="button" disabled>التالي ➡️</button>
    </section>

    <p id="status-message" class="status-message" aria-live="polite"></p>
  </main>

  <footer class="app-footer">
    <p>صُنع بـ ❤️ باستخدام HTML / CSS / JavaScript</p>
  </footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/puzzles.js"></script>
  <script src="assets/js/board.js"></script>
  <script src="assets/js/game.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
